name: Build guide

on:
  schedule:
    - cron: "17 4 * * *"   # daily, 04:17 UTC
  workflow_dispatch:        # "Run workflow" button for a manual rebuild

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build guide.xml.gz
        run: python build_guide.py mapping.json site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4

      # A tiny daily commit counts as repo activity, so GitHub doesn't
      # pause this scheduled workflow after 60 quiet days.
      - name: Record last build
        run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > last-build.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add last-build.txt
          git commit -m "Guide built $(cat last-build.txt)" || true
          git push
